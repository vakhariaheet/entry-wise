services:
  entrywise:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entrywise-api
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - entrywise_data:/app/data
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/entrywise.sqlite
      - UPLOAD_DIR=/app/data/uploads
      # Security Secrets (Generate with: openssl rand -hex 32)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - JWT_SECRET=${JWT_SECRET:-entrywise-self-hosted-default-jwt-secret-change-in-production-32chars}
      # Pluggable Queue Engine: 'memory' (default in-process with retries) or 'http' (QStash / BullMQ / n8n webhook)
      - QUEUE_DRIVER=${QUEUE_DRIVER:-memory}
      - QUEUE_WEBHOOK_URL=${QUEUE_WEBHOOK_URL:-}
      - QUEUE_WEBHOOK_TOKEN=${QUEUE_WEBHOOK_TOKEN:-}
      - QUEUE_MAX_RETRIES=${QUEUE_MAX_RETRIES:-3}
      # Pluggable Default Email Engine: 'resend' | 'smtp2go' | 'mailersend' | 'mailtrap' | 'webhook' | 'console'
      - DEFAULT_EMAIL_PROVIDER=${DEFAULT_EMAIL_PROVIDER:-console}
      - DEFAULT_EMAIL_API_KEY=${DEFAULT_EMAIL_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP2GO_API_KEY=${SMTP2GO_API_KEY:-}
      - MAILERSEND_API_KEY=${MAILERSEND_API_KEY:-}
      - MAILTRAP_API_KEY=${MAILTRAP_API_KEY:-}
      - EMAIL_WEBHOOK_URL=${EMAIL_WEBHOOK_URL:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-notifications@yourdomain.com}
      - DEFAULT_FROM_NAME=${DEFAULT_FROM_NAME:-EntryWise}
      # Optional CORS & Clerk Auth overrides
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  entrywise_data:
